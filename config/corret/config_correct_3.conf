# ============== EJEMPLO 3: REDIRECCIONES Y CGI CORRECTA ==============
# Location con redirecciones y scripts CGI

server {
    listen 8080;
    root /var/www/html;
    index index.html;

    # Location por defecto
    location / {
        methods GET POST;
    }

    # Location para scripts CGI
    location /scripts {
        root /var/www/scripts;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
        methods GET POST;
        client_max_body_size 512000;
    }

    # Location que redirige
    location /old-page {
        return 301 /new-page;
    }

    # Location solo GET por defecto
    location /static {
        root /var/www/static;
        autoindex off;
    }

    # Location con directorio de upload
    location /uploads {
        root /var/uploads;
        upload_store /var/uploads/temp;
        methods POST DELETE;
        autoindex on;
        index upload.html;
    }
}
