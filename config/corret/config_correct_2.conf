# ============== EJEMPLO 2: MÚLTIPLES SERVIDORES CORRECTA ==============
# Dos servidores en puertos diferentes, con nombres distintos

server {
    listen 8080;
    server_name ejemplo.com www.ejemplo.com;
    root /var/www/ejemplo;
    index index.html;

    location / {
        methods GET POST;
    }

    location /api {
        root /var/www/api;
        methods GET POST DELETE;
    }

    error_page 404 /notfound.html;
}

server {
    listen 127.0.0.1:9000;
    server_name localhost internal.dev;
    root /var/www/internal;
    index dashboard.html;
    client_max_body_size 2000000;

    location / {
        autoindex off;
    }

    location /cgi {
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        methods GET POST;
    }
}
