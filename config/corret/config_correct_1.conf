# ============== EJEMPLO 1: CONFIG BÁSICA CORRECTA ==============
# Un servidor simple escuchando en puerto 8080

server {
    listen 8080;
    server_name localhost;
    root /var/www/html;
    index index.html;
    client_max_body_size 1000000;

    location / {
        autoindex on;
    }

    location /uploads {
        root /var/www/uploads;
        methods GET POST DELETE;
        upload_store /var/www/uploads/files;
        client_max_body_size 5000000;
    }

    error_page 404 /404.html;
    error_page 500 /500.html;
}
