# ============== ERROR 6: ARGUMENTO NÚMERO INVÁLIDO ==============
# ❌ client_max_body_size debe ser un número

server {
    listen 8080;
    root /var/www/html;
    client_max_body_size abc;  # ERROR: 'abc' no es número -> RuntimeError: número inválido 'abc'
}

# También es error:
server {
    listen 8080;
    root /var/www/html;

    location / {
        client_max_body_size 1024.5;  # ERROR: Decimal no permitido, solo enteros
    }
}
