# ============== ERROR 2: PUERTO INVÁLIDO ==============
# ❌ Puerto fuera de rango [1-65535]

server {
    listen 99999;  # ERROR: Puerto > 65535 -> RuntimeError: puerto inválido
    root /var/www/html;
}

# También es error:
server {
    listen 0;  # ERROR: Puerto < 1 -> RuntimeError: puerto inválido
    root /var/www/html;
}
